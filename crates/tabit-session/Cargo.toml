[package]
name = "tabit-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tabit session layer: persistent agent sessions over the tabit-engine outer loop."

[lints]
workspace = true

[lib]
name = "tabit_session"
path = "src/lib.rs"
doctest = true

[dependencies]
futures = { workspace = true }
humantime = { workspace = true }
tabit-engine = { path = "../tabit-engine", version = "0.1.0", default-features = false }
tabit-providers = { path = "../tabit-providers", version = "0.1.0", default-features = false }
tabit-derive = { path = "../tabit-derive", version = "0.1.0" }
http = { workspace = true }
petname = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tabit-config = { path = "../tabit-config", version = "0.1.0" }
tabit-wire = { path = "../tabit-wire", version = "0.1.0" }
tabit-log = { path = "../tabit-log", version = "0.1.0" }
tabit-protocol = { path = "../tabit-protocol", version = "0.1.0" }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

tokio = { workspace = true, features = ["macros", "process", "rt", "sync"] }
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
tabit-engine = { path = "../tabit-engine", version = "0.1.0", default-features = false, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
