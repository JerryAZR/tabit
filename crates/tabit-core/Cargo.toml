[package]
name = "tabit-core"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Tabit: the headless backend (print mode + the JSON protocol edge)."

[lints]
workspace = true

[[bin]]
name = "tabit-core"
path = "src/main.rs"

[dependencies]
rig-agent = { path = "../rig-agent", version = "0.41.0", default-features = false }
# rustls must be named here: with default-features off and no unifying
# build, `-p tabit-core` ships reqwest without any TLS stack and every https
# provider request dies in hyper-util with "invalid URL, scheme is not http".
rig-core = { path = "../rig-core", version = "0.41.0", default-features = false, features = ["rustls"] }
tabit-config = { path = "../tabit-config", version = "0.41.0" }
tabit-ext = { path = "../tabit-ext", version = "0.41.0" }
tabit-ext-install = { path = "../tabit-ext-install", version = "0.41.0" }
tokio-util = { version = "0.7", default-features = false }
tabit-protocol = { path = "../tabit-protocol", version = "0.41.0" }
tabit-session = { path = "../tabit-session", version = "0.41.0" }
tabit-tools = { path = "../tabit-tools", version = "0.41.0" }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
httpmock = { workspace = true }
rig-agent = { path = "../rig-agent", version = "0.41.0", default-features = false, features = ["test-utils"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
reqwest = { workspace = true }
