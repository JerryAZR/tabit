[package]
name = "tabit-tools"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Tabit coding tools: read, ls, and shell execution as PortableTools."

[lints]
workspace = true

[lib]
name = "tabit_tools"
path = "src/lib.rs"
doctest = true

[dependencies]
rig-agent = { path = "../rig-agent", version = "0.41.0", default-features = false, features = ["derive"] }
rig-derive = { path = "../rig-derive", version = "0.41.0" }
humantime = { workspace = true }
process-wrap = { version = "9", features = ["std", "job-object", "process-group"] }
rig-core = { path = "../rig-core", version = "0.41.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tabit-protocol = { path = "../tabit-protocol" }
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
