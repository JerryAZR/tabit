[package]
name = "tabit-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tabit coding tools: file reading and shell execution as PortableTools."

[lints]
workspace = true

[lib]
name = "tabit_tools"
path = "src/lib.rs"
doctest = true

[dependencies]
base64 = { workspace = true }
tabit-engine = { path = "../tabit-engine", version = "0.1.0", default-features = false, features = ["derive"] }
tabit-derive = { path = "../tabit-derive", version = "0.1.0" }
# The std flavor (this crate owns no runtime — tool bodies poll on
# the engine's sidecar). Version-aligned with tabit-ext's tokio
# flavor (one major in the tree; the std/tokio split is the crate's
# own feature choice, not a version fork).
process-wrap = { version = "10", default-features = false, features = ["std", "creation-flags", "job-object", "process-group"] }
tabit-providers = { path = "../tabit-providers", version = "0.1.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
similar = "2"
tabit-protocol = { path = "../tabit-protocol" }
tempfile = "3"
tokio = { workspace = true, features = ["sync"] }
tokio-util = { version = "0.7", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# The CreationFlags shim's type — version-matched to process-wrap's own
# windows dependency so they are the same type.
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_System_Threading",
] }

[dev-dependencies]
futures = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
