[package]
name = "tabit-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tabit provider/model configuration: schema, loading, validation."

[lints]
workspace = true

[lib]
name = "tabit_config"
path = "src/lib.rs"
doctest = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tabit-providers = { path = "../tabit-providers", version = "0.1.0", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
