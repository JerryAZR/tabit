[package]
name = "tabit-ext"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Tabit extension host: subprocess extensions over the frozen JSONL pipe."

[lints]
workspace = true

[lib]
name = "tabit_ext"
path = "src/lib.rs"
doctest = true

[dependencies]
# FutureExt::catch_unwind — the interaction lift never strands the
# guest on a panicking capability future.
futures = { workspace = true }
# The interaction capability trait — the lift routes extension asks
# through the engine's `UserInteraction` verbatim (ui_type + opaque
# payload), so the ask shapes stay one concern across core and
# extensions.
rig-agent = { path = "../rig-agent", version = "0.41.0", default-features = false }
# Tree-kill wrapping for every child the host spawns (extensions, and
# the subagent bridge's children — the helper is shared from here): a
# Job Object on Windows / a process group elsewhere, so killing a
# child reclaims its descendants too.
process-wrap = { version = "10", default-features = false, features = [
    "tokio1",
    "creation-flags",
    "job-object",
    "process-group",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tabit-log = { path = "../tabit-log", version = "0.41.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", default-features = false }

# The CreationFlags shim's type — version-matched to process-wrap's own
# windows dependency so they are the same type.
# Junction fallback for skills mounts: a directory symlink needs a
# privilege (or developer mode) on Windows, a junction does not — both
# resolve through canonicalization, so downstream code cannot tell
# them apart.
junction = { workspace = true }

windows = { version = "0.62.2", default-features = false, features = [
    "Win32_System_Threading",
] }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
