[package]
name = "tabit-ext"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Tabit extension host: subprocess extensions over the frozen JSONL pipe."

[lints]
workspace = true

[lib]
name = "tabit_ext"
path = "src/lib.rs"
doctest = true

[dependencies]
# BoxFuture — the HostServices verbs' return shape.
futures = { workspace = true }
# The interaction capability trait — the lift routes extension asks
# through the engine's `UserInteraction` verbatim (ui_type + opaque
# payload), so the ask shapes stay one concern across core and
# extensions.
rig-agent = { path = "../rig-agent", version = "0.41.0", default-features = false }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# The shared grammar on the pipe: commands in, emissions out, watched
# events back (the routing generalization rides tabit-protocol's
# vocabulary verbatim, flat beside the lane frames).
tabit-log = { path = "../tabit-log", version = "0.41.0" }
tabit-protocol = { path = "../tabit-protocol", version = "0.41.0" }
# The child-process substrate (moved to tabit-wire; the supervisor's
# spawn/reap plumbing rides it).
tabit-wire = { path = "../tabit-wire", version = "0.41.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", default-features = false }

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
