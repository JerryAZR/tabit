[package]
name = "tabit-providers"
version.workspace = true
edition = { workspace = true }
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "tabit's provider layer: Anthropic + OpenAI wire clients, streaming, and the portable completion/tool contracts (vendored from rig 0.41.0)."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "tabit_providers"
path = "src/lib.rs"
doctest = true

[dependencies]
percent-encoding = { workspace = true }
as-any = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
httpdate = { workspace = true }
indexmap = { workspace = true }
mime_guess = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "multipart"] }
tabit-derive = { version = "0.1.0", path = "../tabit-derive", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `preserve_order` makes serde_json maps insertion-ordered (IndexMap-backed)
# everywhere, not just in test builds: the anthropic schema sanitizer rebuilds
# `required` from `properties.keys()`, so shipped behavior must match the
# insertion-ordered maps the offline cassettes were recorded with. `indexmap`
# is already a direct dependency, so this adds no new weight.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
http = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }
fastrand = { workspace = true }
eventsource-stream = { workspace = true }
pin-project-lite = { workspace = true }
futures-timer = { workspace = true }
mime = { workspace = true }
reqwest-middleware = { workspace = true, optional = true, features = [
  "json",
  "multipart",
  "charset",
  "http2",
] }

# futures-timer's default backend uses a background timer thread, which cannot
# drive timers on wasm. Pull in its wasm-bindgen (setTimeout) backend whenever
# the target is browser wasm — regardless of feature flags — so
# `wasm_compat::timeout` and the request-retry backoff actually fire instead of
# hanging. Scoped to `target_os = "unknown"` (browser) rather than the whole
# `wasm` family because the gloo-timers/setTimeout backend needs a JS host and
# would be wrong-by-construction on WASI.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }

[dev-dependencies]
anyhow = { workspace = true }
# identity-leak compile-fail tests (tests/identity_leak.rs)
trybuild = "1.0"
# streaming identity/merge law property tests
proptest = "1"
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-test = { workspace = true }
serde_path_to_error = { workspace = true }
base64 = { workspace = true }
reqwest-middleware = { workspace = true, features = [
  "json",
  "multipart",
  "charset",
  "http2",
  "rustls",
] }



[features]
default = ["reqwest", "derive", "rustls"]
derive = ["dep:tabit-derive"]
test-utils = []
socks = ["reqwest/socks"]
reqwest = [
  "reqwest/charset",
  "reqwest/http2",
  "reqwest/system-proxy",
]
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
reqwest-middleware = ["reqwest-middleware-rustls"]
reqwest-middleware-rustls = ["dep:reqwest-middleware", "rustls", "reqwest-middleware/rustls"]
reqwest-middleware-native-tls = ["dep:reqwest-middleware", "native-tls"]
