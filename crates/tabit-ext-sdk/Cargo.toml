[package]
name = "tabit-ext-sdk"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "The tabit extension SDK: own the pipe loop so authors write tool bodies and hooks."

[lints]
workspace = true

[lib]
name = "tabit_ext_sdk"
path = "src/lib.rs"
doctest = true

# Example extensions (ROADMAP item 9's roster): the task-2 demos and
# the developer path's first consumers.
[[bin]]
name = "echo-ext"
path = "src/bin/echo.rs"

[[bin]]
name = "shadow-ext"
path = "src/bin/shadow.rs"

[[bin]]
name = "clash-a-ext"
path = "src/bin/clash_a.rs"

[[bin]]
name = "clash-b-ext"
path = "src/bin/clash_b.rs"

# Task 5's demo: the attribution showcase.
[[bin]]
name = "autotitle-ext"
path = "src/bin/autotitle.rs"

# The owned-children demo (the SDK round's C3 example).
[[bin]]
name = "child-ext"
path = "src/bin/child_ext.rs"

[[bin]]
name = "lmstudio-ext"
path = "src/bin/lmstudio.rs"

[dependencies]
serde = { workspace = true }
# Owned children: the shared client and its async runtime (the settle
# folds and spawns ride one static runtime inside the SDK).
tabit-wire = { path = "../tabit-wire", version = "0.41.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", default-features = false }
# The wire types, shared with the host (the 2026-09 sharing ruling:
# one wire, one set of shapes — the docs stay the contract for other
# languages, the conformance tests keep crate and docs honest).
tabit-ext = { path = "../tabit-ext", version = "0.41.0" }
tabit-protocol = { path = "../tabit-protocol", version = "0.41.0" }
# The relay example's HTTP halves: tiny_http serves the local
# openai-completions wire (the small, battle-tested, sync server) and
# reqwest's blocking client speaks LM Studio's native REST API
# upstream. The lib surface uses neither — they exist for the example
# bins, and leave with the template extraction (task 6).
reqwest = { workspace = true, features = ["blocking", "json"] }
serde_json = { workspace = true }
tiny_http = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
tokio-util = { version = "0.7", default-features = false }
rig-agent = { path = "../rig-agent", version = "0.41.0", default-features = false }
tabit-ext = { path = "../tabit-ext", version = "0.41.0" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
