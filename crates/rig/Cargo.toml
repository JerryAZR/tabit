[package]
name = "rig"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "An opinionated library for building LLM powered applications."
repository = "https://github.com/0xPlaygrounds/rig"
# Examples now live in their own packages under `examples/*`; don't auto-discover
# them as examples of this crate.
autoexamples = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.41.0", default-features = false }
rig-agent = { path = "../rig-agent", version = "0.41.0", optional = true, default-features = false }
rig-derive = { path = "../rig-derive", version = "0.41.0", optional = true }

[features]
default = ["rig-core/default", "agent", "derive", "rustls"]
agent = ["dep:rig-agent"]
test-utils = ["rig-core/test-utils", "rig-agent?/test-utils"]
audio = ["rig-core/audio", "rig-agent?/audio"]
image = ["rig-core/image", "rig-agent?/image"]
derive = ["dep:rig-derive", "rig-core/derive", "rig-agent?/derive"]
pdf = ["rig-core/pdf"]
epub = ["rig-core/epub"]
rayon = ["rig-core/rayon"]
socks = ["rig-core/socks"]
reqwest = ["rig-core/reqwest"]
rustls = ["rig-core/rustls"]
native-tls = ["rig-core/native-tls"]
reqwest-middleware = ["rig-core/reqwest-middleware"]
reqwest-middleware-rustls = ["rig-core/reqwest-middleware-rustls"]
reqwest-middleware-native-tls = ["rig-core/reqwest-middleware-native-tls"]

[dev-dependencies]
rig-core = { path = "../rig-core", version = "0.41.0", default-features = false, features = [
    "test-utils",
] }
rig-agent = { path = "../rig-agent", version = "0.41.0", default-features = false, features = [
    "test-utils",
] }
anyhow = { workspace = true }
async-stream = { workspace = true }
assert_fs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
httpmock = { workspace = true, features = ["record", "proxy"] }
reqwest = { workspace = true, features = ["json", "stream"] }
reqwest-middleware = { workspace = true, features = [
    "json",
    "multipart",
    "charset",
    "http2",
    "rustls",
] }
reqwest-retry = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# `float_roundtrip` keeps cassette scrubbing idempotent on float-heavy bodies
# (e.g. embedding vectors): without it, parse→print can oscillate between two
# representations of the same decimal and the recorded YAML never stabilizes.
# (`preserve_order` comes via rig-core's own dependency, where it belongs.)
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
# `syn` drives the AST scan in `tests/common/cassette_safety.rs`; it is the one
# crate from upstream's "drop" list that a kept test actually needs.
syn = { workspace = true, features = ["full", "visit"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
axum = { workspace = true }
aws-smithy-eventstream = { workspace = true }
aws-smithy-types = { workspace = true }
