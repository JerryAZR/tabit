[package]
name = "tabit-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "tabit's agent engine: the turn loop, hooks, tool runtime, and streaming substrate (vendored from rig 0.41.0)."

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "tabit_engine"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
indexmap = { workspace = true }
tabit-providers = { path = "../tabit-providers", version = "0.1.0", default-features = false }
tabit-log = { path = "../tabit-log", version = "0.1.0" }
tabit-derive = { path = "../tabit-derive", version = "0.1.0", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
# The run token (cancellation's WHEN signal) — carried by ToolContext
# and read by hook contexts for the forwarded lanes.
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }
tracing-futures = { workspace = true, features = ["futures-03"] }

# MCP is native-only. rmcp's `ClientHandler` requires `Send + Sync`
# unconditionally (its `local` feature relaxes only the future bounds), which
# rig's tool registry cannot satisfy on wasm, where `WasmCompatSend`/
# `WasmCompatSync` are no-op markers. Scoping the dependency out of the wasm
# graph keeps the wasm dependency tree honest; `tool/mod.rs` raises a targeted
# `compile_error!` if the feature is requested there anyway.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rmcp = { workspace = true, optional = true, features = ["client"] }
# The tool-body sidecar runtime (tool/mod.rs `tool_body_runtime`) is
# native-only; scoping the feature keeps the wasm dependency tree honest.
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
anyhow = { workspace = true }
# `cargo test -p tabit-engine` needs tabit-providers's mock models even when the
# `test-utils` feature is not requested explicitly.
tabit-providers = { path = "../tabit-providers", features = ["test-utils"] }
tokio = { workspace = true, features = ["full"] }
tokio-test = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[features]
default = ["derive"]
derive = ["dep:tabit-derive", "tabit-providers/derive"]
test-utils = ["tabit-providers/test-utils"]
rmcp = ["dep:rmcp"]
