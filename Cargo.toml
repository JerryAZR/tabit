# Tabit workspace root (virtual manifest).
# Foundation crates vendored from rig 0.41.0; see VENDOR.md.

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/rig-core", "crates/rig-agent", "crates/rig-derive", "crates/rig"]
exclude = []

[workspace.package]
version = "0.41.0"
edition = "2024"

[workspace.lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[workspace.dependencies]
rig-agent = { path = "crates/rig-agent", version = "0.41.0" }
rig-core = { path = "crates/rig-core", version = "0.41.0" }
anyhow = "1.0.102"
arrow-array = "58"
as-any = "0.3.2"
assert_fs = "1.1.3"
async-stream = "0.3.6"
axum = "0.8.4"
aws-config = { version = "1.8.5", default-features = false }
aws-sdk-bedrockruntime = { version = "1.124.0", default-features = false }
aws-smithy-eventstream = "0.60.18"
aws-smithy-runtime-api = "1.11.3"
aws-smithy-types = "1.3.2"
base64 = "0.22.1"
bytes = "1.10.1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
chrono = "0.4"
convert_case = "0.11.0"
deranged = "=0.5.8"
dotenvy = "0.15.7"
epub = "2.1.4"
ethers = "2.0.14"
eventsource-stream = "0.2.3"
fastembed = { version = "4.9.1", default-features = false }
fastrand = "2.3.0"
futures = "0.3.32"
futures-timer = "3.0.3"
glob = "0.3.2"
google-cloud-auth = "1.10"
google-cloud-aiplatform-v1 = { version = "1.11.0", default-features = false, features = [
    "prediction-service",
] }
http = "1.3.1"
httpmock = "0.8.3"
hyper-util = "0.1.14"
indexmap = "2.14.0"
indoc = "2.0.6"
lancedb = { version = "0.30", default-features = false }
log = "0.4.27"
lopdf = "0.41.0"
mime = "0.3.17"
