# Tabit workspace root (virtual manifest).
# Foundation crates vendored from rig 0.41.0; see VENDOR.md.

[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/rig-core", "crates/rig-agent", "crates/rig-derive", "crates/rig"]
exclude = []

[workspace.package]
version = "0.41.0"
edition = "2024"

[workspace.lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
as-any = "0.3.2"
async-stream = "0.3.6"
axum = "0.8.4"
aws-smithy-eventstream = "0.60.18"
aws-smithy-types = "1.3.2"
base64 = "0.22.1"
bytes = "1.10.1"
convert_case = "0.11.0"
eventsource-stream = "0.2.3"
fastrand = "2.3.0"
futures = "0.3.32"
futures-timer = "3.0.3"
http = "1.3.1"
httpdate = "1.0"
httpmock = "0.8.3"
indexmap = "2.14.0"
mime = "0.3.17"
mime_guess = "2.0.5"
ordered-float = "5.0.0"
pin-project-lite = "0.2.16"
proc-macro2 = "1.0.95"
quote = "1.0.40"
rayon = "1.10.0"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = { version = "0.5.2", default-features = false }
reqwest-retry = "0.9"
rmcp = "2.2.0"
url = "2.5"
schemars = "1.0.4"
serde = "1.0.219"
serde_yaml = "0.9.34"
serde_json = "1.0.150"
sha2 = "0.10.9"
serde_path_to_error = "0.1.17"
syn = "2.0.104"
thiserror = "2.0.12"
tokio = "1.52.3"
tokio-test = "0.4.4"
tracing = "0.1.41"
tracing-futures = "0.2.5"
tracing-subscriber = "0.3.19"

[profile.release]
lto = true
opt-level = "s"
